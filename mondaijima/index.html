<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9eef7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="もんだいじま">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>もんだいじま</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
</head>
<body>
<style>
/* Layout: 青空の下の「島めぐり」。島マップ → 1枚のクイズカード（上に進みぐあい、まん中に問題、下に大きなボタン）。相棒キャラが左に立ってしゃべる。子ども向けに明るい1テーマで統一。 */
:root{
  --sky:#d9eef7; --sky2:#f4fbff; --card:#fffdf5; --ink:#2b3140; --sub:#6b7a88; --line:#cfe0e8;
  --accent:#ff8a3d; --accent-d:#e46d1f; --star:#ffc93c; --ok:#2fb57c; --ok-bg:#e3f7ee; --ng:#ef5b5b; --ng-bg:#fde8e8;
  --key:#eef6fa; --sea:#8fd3ea; --sand:#ffe9b8; --grass:#7ccf7a; --lock:#c9d3da; --shadow:rgba(43,49,64,.14);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --font-pop:"Hachi Maru Pop","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
html,body{height:100%}
body{margin:0;background:linear-gradient(var(--sky2),var(--sky) 60%);color:var(--ink);font-family:var(--font);font-weight:500;font-size:18px;line-height:1.6;padding-inline:16px;padding-block:12px 24px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:inherit}
h1,h2,h3{margin:0;text-wrap:balance}

.app{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.logo{display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.5vw,16px);margin:0;line-height:1}
.logo .mark{width:clamp(48px,12vw,68px);height:clamp(48px,12vw,68px);flex:none;filter:drop-shadow(0 4px 0 rgba(33,102,222,.25))}
.logo .mark svg{width:100%;height:100%;display:block}
.logo .wm{font-family:var(--font);font-weight:800;font-size:clamp(30px,8.5vw,48px);letter-spacing:.02em;color:#1f4fb4}
.logo .wm b{color:var(--accent);font-weight:800}
.logo.sm .mark{width:40px;height:40px}.logo.sm .wm{font-size:clamp(24px,6vw,32px)}
.logo-sub{margin:-6px 0 0;text-align:center;font-weight:800;font-size:13px;color:var(--sub);letter-spacing:.18em}
.card{background:var(--card);border-radius:22px;box-shadow:0 6px 0 var(--line),0 12px 28px var(--shadow);padding:clamp(16px,4vw,26px)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--sub);font-size:14px}
.sec{font-weight:800;font-size:15px;color:var(--sub);letter-spacing:.1em;margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:60px;padding:10px 22px;border-radius:18px;font-weight:800;font-size:20px;background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-d);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d)}
.btn.sub{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.sub:active{box-shadow:0 1px 0 var(--line)}
.btn.sm{min-height:44px;font-size:16px;padding:6px 16px;border-radius:14px}
.btn:disabled{opacity:.5;transform:none}
.link{color:var(--sub);text-decoration:underline;font-size:15px;min-height:44px;padding:8px}

/* プレイヤー */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;border-radius:20px;background:#fff;border:3px solid var(--line);min-height:170px;transition:transform .1s}
.pcard:active{transform:scale(.97)}
.pcard.new{border-style:dashed;justify-content:center;color:var(--sub);font-weight:800}
.pcard.edit{border-color:#f3b8b8;background:#fff7f7}
.btn.del{background:var(--ng);box-shadow:0 5px 0 #c33}
.pcard .pal{width:84px;height:84px}
.pname{font-weight:800;font-size:19px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plv{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:4px}
.plv svg{width:16px;height:16px}
.name-in{width:100%;min-height:60px;font-size:24px;font-weight:800;padding:8px 16px;border:3px solid var(--line);border-radius:16px;background:#fff;color:var(--ink)}
.charpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.charpick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:18px;border:3px solid var(--line);background:#fff;font-weight:800}
.charpick button[aria-pressed="true"]{border-color:var(--accent);background:#fff4ec}
.charpick .pal{width:72px;height:72px}
.charpick small{font-weight:500;font-size:12px;color:var(--sub)}

/* モード */
.modes{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.modes{grid-template-columns:repeat(2,1fr)}}
.mode{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;border-radius:22px;background:#fff;border:3px solid var(--line);font-weight:800;font-size:22px;min-height:120px;transition:transform .1s}
.mode:active{transform:scale(.97)}
.mode svg{width:56px;height:56px}
.mode small{font-size:13px;color:var(--sub);font-weight:500}
.mode .prog{font-size:13px;color:var(--accent-d);font-weight:800}

/* マップ */
.mapwrap{overflow-x:auto;overflow-y:hidden;padding:54px 8px 8px;margin:0 -8px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.map{display:flex;align-items:flex-start;gap:0;min-width:max-content;padding-inline:8px}
.isl{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:112px;flex:none}
.isl + .isl::before{content:"";position:absolute;left:-56px;top:36px;width:56px;border-top:4px dashed var(--line);z-index:0}
.isl.done + .isl::before{border-color:var(--ok)}
.node{position:relative;width:76px;height:76px;border-radius:50%;border:4px solid var(--line);background:var(--sand);display:grid;place-items:center;font-weight:800;font-size:24px;z-index:1;transition:transform .1s}
.node:active:not(:disabled){transform:scale(.95)}
.isl.done .node{background:var(--grass);border-color:#4faa5c;color:#fff}
.isl.now .node{background:#fff;border-color:var(--accent);box-shadow:0 0 0 6px #ffe0c7}
.isl.lock .node{background:var(--lock);border-color:#aeb9c2;color:#fff}
.isl.boss .node{width:88px;height:88px;font-size:28px;margin-top:-6px}
.node svg.lk{width:28px;height:28px}
.isl .nm{font-size:12px;font-weight:800;text-align:center;line-height:1.3;max-width:104px}
.isl.lock .nm{color:var(--sub)}
.isl .rate{display:flex;gap:2px;height:18px}
.isl .rate svg{width:18px;height:18px}
.isl .me{position:absolute;top:-54px;left:50%;transform:translateX(-50%);width:64px;height:64px;z-index:2}
.isl .me .pal{width:64px;height:64px}
.lvtag{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--accent-d);border-radius:999px;padding:1px 10px}

/* プレイ */
.top{display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:5px;flex:1;min-width:0;flex-wrap:wrap}
.dots i{width:18px;height:18px;flex:none;border-radius:50%;background:#fff;border:2px solid var(--line);display:inline-block}
.dots i.ok{background:var(--ok);border-color:var(--ok)}
.dots i.ng{background:var(--ng);border-color:var(--ng)}
.dots i.now{border-color:var(--accent);border-width:4px}
.coins{display:flex;align-items:center;gap:4px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.coins svg{width:26px;height:26px}
.stage{display:flex;gap:12px;align-items:flex-end}
.pal{width:110px;height:110px;flex:none;overflow:visible}
.pal svg{width:100%;height:100%;overflow:visible;will-change:transform}
.pal.idle svg{animation:bob 2.4s ease-in-out infinite}
.pal.happy svg{animation:jump .7s ease-out}
.pal.sad svg{animation:shake .5s ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-26px) scale(1.06,.94)}60%{transform:translateY(0) scale(.96,1.06)}100%{transform:translateY(0) scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pal svg,.bigstars svg{animation:none!important}}
.bubble{position:relative;flex:1;min-width:0;background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:800;font-size:17px;margin-bottom:28px}
.bubble::after{content:"";position:absolute;left:-14px;bottom:14px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.q{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.q-tag{align-self:flex-start;font-size:13px;font-weight:800;color:var(--accent-d);background:#fff4ec;border-radius:999px;padding:2px 12px}
.q-text{font-size:clamp(21px,5vw,27px);font-weight:800;line-height:1.5;max-width:100%}
.q-big{font-size:clamp(72px,22vw,110px);line-height:1.15;font-weight:800;background:#fff;border:3px dashed var(--line);border-radius:20px;padding:4px 28px}
.q-eq{font-size:clamp(40px,10vw,56px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.q-eq.small{font-size:clamp(24px,6vw,34px);letter-spacing:0}
.q-vis{width:min(100%,280px)}
.q-vis svg{width:100%;height:auto;display:block}
.q-vis.wide{width:100%}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices.c1{grid-template-columns:1fr}
.choice{min-height:68px;padding:10px 14px;border-radius:18px;background:#fff;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;text-align:center;min-width:0;overflow-wrap:anywhere;transition:transform .08s}
.choice:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.choice.shape{padding:8px}
.choice.shape svg{width:88px;height:88px}
.choice.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 5px 0 var(--ok)}
.choice.wrong{border-color:var(--ng);background:var(--ng-bg);box-shadow:0 5px 0 var(--ng)}
.choice.dim{opacity:.45}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:380px;margin-inline:auto;width:100%}
.disp{grid-column:1/-1;min-height:70px;background:#fff;border:3px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:flex-end;padding:0 20px;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.disp.empty{color:var(--line)}
.key{min-height:62px;border-radius:16px;background:var(--key);border:2px solid var(--line);font-size:28px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.key:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.go{background:var(--accent);color:#fff;border-color:var(--accent-d);box-shadow:0 4px 0 var(--accent-d);font-size:20px}
.key.del{font-size:20px}
.fb{border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.fb.ok{background:var(--ok-bg);border:3px solid var(--ok)}
.fb.ng{background:var(--ng-bg);border:3px solid var(--ng)}
.fb-h{font-family:var(--font-pop);font-size:clamp(28px,7vw,38px);line-height:1.2}
.fb.ok .fb-h{color:var(--ok)}.fb.ng .fb-h{color:var(--ng)}
.fb-a{font-weight:800;font-size:22px}
.fb-e{font-size:16px;max-width:36em;margin:0}


/* 横向き：左に問題、右にボタン */
.play{display:flex;flex-direction:column;gap:14px}
.pl-left,.pl-right{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (orientation:landscape) and (min-width:600px){
  body{padding-block:8px 12px}
  .app:has(.play){max-width:1280px}
  .play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(12px,2.5vw,28px);align-items:start}
  .pl-left,.pl-right{gap:clamp(8px,1.8vh,14px)}
  .play .pal{width:clamp(52px,13vh,100px);height:clamp(52px,13vh,100px)}
  .play .bubble{margin-bottom:clamp(8px,3vh,24px);font-size:clamp(14px,2.6vh,17px);padding:6px 12px}
  .play .card{padding:clamp(12px,2.5vh,24px)}
  .play .q{gap:clamp(6px,1.5vh,12px)}
  .play .q-text{font-size:clamp(17px,3.8vh,27px)}
  .play .q-big{font-size:clamp(48px,17vh,110px)}
  .play .q-eq{font-size:clamp(28px,8vh,56px)}
  .play .q-eq.small{font-size:clamp(18px,4.5vh,34px)}
  .play .q-vis{width:min(100%,clamp(140px,40vh,280px))}
  .play .q-vis.wide{width:100%}
  .play .q-vis svg{max-height:38vh;width:auto;max-width:100%;margin-inline:auto}
  .pl-right{position:sticky;top:8px}
  .play .choices,.play .choices.c1{grid-template-columns:1fr 1fr;gap:clamp(8px,1.6vh,12px)}
  .play .choice{min-height:clamp(46px,15vh,110px);font-size:clamp(16px,3.6vh,22px);padding:6px 10px}
  .play .choice.shape svg{width:clamp(48px,14vh,88px);height:clamp(48px,14vh,88px)}
  .play .pad{max-width:none;gap:clamp(6px,1.4vh,10px)}
  .play .disp{min-height:clamp(44px,12vh,96px);font-size:clamp(26px,7.5vh,56px)}
  .play .key{min-height:clamp(40px,12.5vh,104px);font-size:clamp(20px,5vh,36px)}
  .play .key.go,.play .key.del{font-size:clamp(15px,3vh,20px)}
  .play.has-fb .pad{display:none}
  .play .fb{padding:clamp(8px,2vh,16px) 14px;gap:clamp(4px,1vh,8px)}
  .play .fb-h{font-size:clamp(22px,5vh,38px)}
  .play .fb .btn{min-height:clamp(44px,10vh,60px)}
}
/* けっか */
.res{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.bigstars{display:flex;gap:6px}
.bigstars svg{width:64px;height:64px;animation:pop .5s ease-out both}
.bigstars svg:nth-child(2){animation-delay:.25s}.bigstars svg:nth-child(3){animation-delay:.5s}
.res-h{font-family:var(--font-pop);font-size:clamp(28px,7vw,40px);line-height:1.2;color:var(--accent-d)}
.res-score{font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.res-list{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.res-list li{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:8px 12px;font-size:15px}
.res-list li b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px}
.res-list li b.ok{background:var(--ok)}.res-list li b.ng{background:var(--ng)}
.res-list li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* おうちのひと */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{min-height:44px;padding:6px 16px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:15px}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:#fff;border-radius:14px;padding:10px 14px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:13px;color:var(--sub)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 2fr auto;gap:10px;align-items:center;font-size:15px}
.bar .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{height:14px;background:#fff;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar .fil{height:100%;background:var(--ok);border-radius:999px}
.bar .fil.low{background:var(--ng)}.bar .fil.mid{background:var(--star)}
.bar .num{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px;white-space:nowrap}
.plays{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plays li{background:#fff;border-radius:12px;padding:10px 14px;font-size:15px}
.plays summary{cursor:pointer;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-weight:800}
.plays summary .muted{font-weight:500}
.plays summary .rt{display:inline-flex;gap:1px}
.plays summary .rt svg{width:16px;height:16px}
.plays ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--sub)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-width:44px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-d);color:#fff}
.danger{color:var(--ng)}
</style>

<main class="app" id="app"></main>

<script>
/*GEN-START*/
const R=n=>Math.floor(Math.random()*n), pick=a=>a[R(a.length)], rng=(a,b)=>a+R(b-a+1);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const CHARS={puni:{name:"ぷにまる",desc:"ぷにぷにの もりのこ"},penta:{name:"ペンタ",desc:"マフラーが じまん"},don:{name:"ドンちゃん",desc:"どんぐりの ぼうけんか"}};
const TYPES={
  addsub:["たしざん・ひきざん","math"],kuku:["九九","math"],clock:["とけい","math"],len:["ながさ","math"],num:["かずの しくみ","math"],mistake:["まちがいさがし","math"],shape:["かたち","math"],shop:["おかいもの","math"],kasa:["かさ（L・dL）","math"],blank:["あなうめ けいさん","math"],dots:["かぞえよう","math"],nth:["なんばんめ","math"],order:["おおきさくらべ","math"],
  kanji:["かんじの よみ","jp"],okuri:["おくりがな","jp"],homo:["おなじ よみの かんじ","jp"],compose:["かんじ あわせ","jp"],oppo:["はんたい ことば","jp"],odd:["なかまはずれ","jp"],cat:["ことばの なかま","jp"],kata:["カタカナ","jp"],loan:["カタカナの ことば","jp"],small:["ちいさい じ","jp"],part:["は・を・へ","jp"],subj:["だれが どうする","jp"],sorder:["ことばの ならべかえ","jp"],shiri:["しりとり","jp"],count:["かぞえかた","jp"],ono:["ようすの ことば","jp"],
  ikimono:["いきもの","jo"],shizen:["しぜん・うちゅう","jo"],karada:["からだ・けんこう","jo"],kurashi:["くらし・あんぜん","jo"],chiri:["にほん・せかい・れきし","jo"],gyouji:["きせつ・ぎょうじ","jo"],kotowaza:["ことわざ","jo"],kanyou:["からだの ことば（かんようく）","jo"],yoji:["よじじゅくご","jo"]
};
const ISLANDS=["はじまりのはま","どんぐりのもり","ペンギンこうげん","かぜのおか","ほしぞらみさき","とけいだい","にじのたき","くじらのいりえ","かがみのみずうみ","ゆきやま","ドラゴンのほらあな","でんせつのしろ"];

    :'<circle cx="'+(cx-9)+'" cy="'+cy+'" r="3.4" fill="#2b3140"/><circle cx="'+(cx+9)+'" cy="'+cy+'" r="3.4" fill="#2b3140"/>';

let AC=null,muted=false;try{muted=localStorage.getItem("mj-mute")==="1"}catch(e){}
function tone(f,t0,d,type){const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.25,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.05)}
function ensureAudio(){if(muted||AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function snd(k){if(muted||!AC)return;try{if(AC.state==="suspended")AC.resume();const t=AC.currentTime;
  if(k==="ok"){tone(880,t,.15);tone(1320,t+.13,.25)}else if(k==="ng"){tone(180,t,.3,"square")}else if(k==="tap"){tone(600,t,.05)}else if(k==="win"){[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.12,.3))}else if(k==="lose"){[400,330].forEach((f,i)=>tone(f,t+i*.2,.3))}}catch(e){}}

const Local={key:"mondaijima",load(){try{return JSON.parse(localStorage.getItem(this.key))||{}}catch(e){return{}}},save(d){try{localStorage.setItem(this.key,JSON.stringify(d))}catch(e){}},
  async listPlayers(){return Object.values(this.load().players||{}).sort((a,b)=>a.createdAt-b.createdAt)},
  async savePlayer(p){const d=this.load();(d.players=d.players||{})[p.id]=p;this.save(d)},
  async deletePlayer(id){const d=this.load();if(d.players)delete d.players[id];this.save(d)},
  async listPlays(pid){return Object.values(this.load().plays||{}).filter(x=>x.playerId===pid).sort((a,b)=>b.at-a.at)},
  async savePlay(p){const d=this.load();(d.plays=d.plays||{})[p.id]=p;this.save(d)},
  async getSettings(){return this.load().settings||{}},
  async saveSettings(s){const d=this.load();d.settings=s;this.save(d)}};
const clone=o=>JSON.parse(JSON.stringify(o));
const Cloud=db=>({
  async listPlayers(){return (await db.collection("players").orderBy("createdAt").get()).docs.map(d=>clone(d.data()))},
  savePlayer:p=>db.doc("players/"+p.id).set(p),
  deletePlayer:id=>db.doc("players/"+id).delete(),
  async listPlays(pid){return (await db.collection("plays").where("playerId","==",pid).orderBy("at","desc").limit(300).get()).docs.map(d=>clone(d.data()))},
  savePlay:p=>db.doc("plays/"+p.id).set(p),
  async getSettings(){const s=await db.doc("settings/main").get();return s.exists?clone(s.data()):{}},
  saveSettings:s=>db.doc("settings/main").set(s)});
let store=Local,backend="local";

  const g=S.game,q=g.qs[g.i];if(!q||g.fb||g.log[g.i]||Date.now()<(g.lockUntil||0))return;
  const ms=Date.now()-g.qStart;g.log[g.i]={t:q.t,ok,ms,text:q.text+(q.big?"「"+q.big+"」":"")+(q.eq?" "+q.eq:""),ans:q.kind==="num"?String(q.ans):(q.svgChoices?"（かたち）":q.choices[0])};
  if(ok){g.coins++;g.combo++;g.mood="happy";g.line=g.combo>=3&&g.combo%3===0?LINES.combo.replace("{c}",g.combo):pick(LINES.ok)}else{g.combo=0;g.mood="sad";g.line=pick(LINES.ng)}
  g.fb={ok,pick:pk};g.lockUntil=Date.now()+400;render();snd(ok?"ok":"ng");
  if(ok&&g.i+1<g.qs.length){const fb=g.fb;g.timer=setTimeout(()=>{if(S.game===g&&g.fb===fb)next()},1400)}
}
function next(){const g=S.game;if(!g||!g.fb)return;clearTimeout(g.timer);g.i++;g.fb=null;g.typed="";g.mood="idle";g.lockUntil=Date.now()+350;
  if(g.i>=g.qs.length){S.screen="result";finish();snd(g.rate>0?"win":"lose")}else{g.qStart=Date.now();g.line=g.i===Math.floor(g.qs.length/2)?"はんぶん きたよ！":pick(["つぎの もんだい！","いくよー","これは どうかな？","かんがえて みよう"])}render()}
function finish(){
  const g=S.game;if(g.saved)return;g.saved=true;
  const by={};g.log.forEach(l=>{const b=by[l.t]=by[l.t]||{ok:0,n:0,ms:0};b.n++;b.ms+=l.ms;if(l.ok)b.ok++});
  g.rate=rateOf(g.coins,g.qs.length);
  const p=S.player,pr=prog(p,g.mode);g.first=g.rate>0&&!(pr.rate[g.k]>0);
  if(g.rate>(pr.rate[g.k]||0))pr.rate[g.k]=g.rate;if(g.rate>0&&g.k>=pr.cur)pr.cur=g.k+1;
  const play={id:uid("g"),playerId:p.id,playerName:p.name,char:p.char,mode:g.mode,stage:g.k,stageName:islandName(g.k),level:lvOf(g.k),rate:g.rate,score:g.coins,total:g.qs.length,durationSec:Math.round((Date.now()-g.startedAt)/1000),at:Date.now(),byType:by,wrong:g.log.filter(l=>!l.ok).map(l=>({t:l.t,text:l.text,ans:l.ans}))};
  p.coins=coinsOf(p)+g.coins;p.plays=(p.plays||0)+1;p.lastAt=play.at;delete p.stars;
  const cp=JSON.parse(JSON.stringify(p));write(s=>s.savePlay(play));write(s=>s.savePlayer(cp));
}
function resultHTML(){
  const g=S.game,n=g.qs.length,s=g.coins,r=g.rate,p=S.player;
  const head=r===3?"パーフェクト！":r===2?"クリア！ すごい！":r===1?"クリア！":"もう すこし！";
  const msg=r===3?islandName(g.k)+"を かんぺきに クリア！":r>0?(g.first?"つぎの しまへの みちが ひらいたよ！":"もう いちど クリア！ つぎの しまへ すすもう"):"あと "+(Math.ceil(n*.7)-s)+"もん せいかいで クリアだよ。まちがえた もんだいを みて、もういちど！";
  return '<section class="card res">'+pal(p.char,r>0?"happy":"idle")+'<div class="bubble" style="margin:0">'+esc(msg)+'</div><div class="res-h">'+head+'</div><div class="bigstars">'+rateHTML(r)+'</div><div class="res-score">'+s+' / '+n+' もん せいかい</div>'+
  '<p class="muted">'+esc(p.name)+'の コイン：ぜんぶで '+coinsOf(p)+'まい（レベル '+lv(coinsOf(p))+'）</p>'+
  '<ol class="res-list">'+g.log.map((l,i)=>'<li><b class="'+(l.ok?"ok":"ng")+'">'+(i+1)+'</b><span>'+esc(l.text)+(l.ok?"":"　→ "+esc(l.ans))+'</span></li>').join("")+'</ol>'+
  '<div class="row" style="width:100%;margin-top:6px">'+(r>0?'<button class="btn grow" data-act="stage" data-k="'+(g.k+1)+'">つぎの しまへ</button><button class="btn sub grow" data-act="stage" data-k="'+g.k+'">もういちど</button>':'<button class="btn grow" data-act="stage" data-k="'+g.k+'">もういちど ちょうせん</button>')+'</div><div class="row" style="justify-content:center"><button class="link" data-act="map" data-mode="'+g.mode+'">マップへ もどる</button><button class="link" data-act="mine">きろくを みる</button></div></section>';
}
/* おうちのひと */
function gateHTML(){const q=S.gate;return LOGO(1)+'<section class="card" style="display:flex;flex-direction:column;gap:14px;align-items:center"><p class="sec">おうちのひと かくにん'+(q.next==="edit"?"（プレイヤーを けす）":"")+'</p><p class="muted" style="margin:0">おとなの ひとに やってもらってね</p><div class="q-eq">'+q.a+' × '+q.b+' ＝ ？</div>'+
  '<div class="pad"><div class="disp'+(q.typed?"":" empty")+'">'+(q.typed||"？")+'</div>'+[1,2,3,4,5,6,7,8,9].map(n=>'<button class="key" data-act="gkey" data-k="'+n+'">'+n+'</button>').join("")+'<button class="key del" data-act="gkey" data-k="del">けす</button><button class="key" data-act="gkey" data-k="0">0</button><button class="key go" data-act="gsubmit"'+(q.typed?"":" disabled")+'>OK</button></div>'+(q.err?'<p class="danger">ちがいます</p>':"")+'<button class="link" data-act="home">もどる</button></section>'}
async function openParent(){S.parent={pid:S.players[0]?S.players[0].id:null,plays:null,confirmDel:false};S.screen="parent";render();await loadPlays()}
async function openMine(){S.parent={pid:S.player.id,plays:null,confirmDel:false,kid:true};S.screen="parent";render();await loadPlays()}
async function loadPlays(){const P=S.parent;if(!P||!P.pid){render();return}P.plays=null;render();try{P.plays=await store.listPlays(P.pid)}catch(e){P.plays=[]}render()}
function parentHTML(){
  const P=S.parent,st=S.settings,pl=S.players.find(p=>p.id===P.pid);
  let h;if(P.kid&&pl){h='<section class="card" style="display:flex;flex-direction:column;gap:14px"><div class="stage">'+pal(pl.char,"happy")+'<div class="bubble">'+esc(pl.name)+'の きろく だよ！</div></div><div class="row" style="justify-content:flex-end"><button class="btn sub sm" data-act="mode">もどる</button></div>'}else{
  h='<section class="card" style="display:flex;flex-direction:column;gap:14px"><div class="row" style="justify-content:space-between"><h2 style="font-size:22px">おうちのひと ページ</h2><button class="btn sub sm" data-act="home">とじる</button></div>'+
  '<p class="muted">記録の保存先：'+(backend==="cloud"?"クラウド（この作品のデータ。どの端末でも同じ記録）":"この端末のブラウザのみ（ログインして開くとクラウドに保存されます）")+'</p>'+
  '<div class="row"><span class="grow">九九はどの段まで出す？（島のレベルでも上限がかかります）</span><div class="seg">'+[2,3,4,5,6,7,8,9].map(n=>'<button data-act="kuku" data-n="'+n+'" aria-pressed="'+(st.kukuMax===n)+'">'+n+'</button>').join("")+'</div></div>'+
  '<div class="row"><span class="grow">1つの島の問題数（7割正解でクリア）</span><div class="seg">'+[5,10,15].map(n=>'<button data-act="nq" data-n="'+n+'" aria-pressed="'+(st.nQ===n)+'">'+n+'</button>').join("")+'</div></div></section>';
  }
  if(!S.players.length)return h+'<section class="card"><p class="muted">まだプレイヤーがいません。</p></section>';
  if(!P.kid)h+='<section class="card" style="display:flex;flex-direction:column;gap:14px"><div class="tabs">'+S.players.map(p=>'<button class="tab" data-act="ptab" data-id="'+p.id+'" aria-pressed="'+(p.id===P.pid)+'">'+esc(p.name)+'</button>').join("")+'</div>';
  if(!pl)return h+'</section>';
  const plays=P.plays;
  if(!plays)return h+'<p class="muted">読み込み中…</p></section>';
  const tot=plays.reduce((a,p)=>a+p.total,0),okn=plays.reduce((a,p)=>a+p.score,0),last=plays[0];
  h+='<div class="kpis"><div class="kpi"><b>'+plays.length+'</b><span>あそんだ回数</span></div><div class="kpi"><b>'+(tot?Math.round(okn/tot*100):0)+'%</b><span>正答率（ぜんぶ）</span></div><div class="kpi"><b>'+coinsOf(pl)+'</b><span>コイン合計・Lv'+lv(coinsOf(pl))+'</span></div><div class="kpi"><b style="font-size:18px">'+(last?fmtDate(last.at):"−")+'</b><span>さいごに遊んだ日</span></div></div>';
  h+='<p class="sec">島のすすみぐあい</p><div class="kpis">'+Object.keys(MODES).map(m=>{const pr=prog(pl,m);const cl=Object.values(pr.rate).filter(r=>r>0).length;const st3=Object.values(pr.rate).reduce((a,b)=>a+b,0);return '<div class="kpi"><b>'+cl+'<span style="font-size:14px"> 島クリア</span></b><span>'+MODES[m]+'・いま '+islandName(pr.cur)+'（Lv'+lvOf(pr.cur)+'）・星'+st3+'</span></div>'}).join("")+'</div>';
  const by={};plays.forEach(p=>Object.entries(p.byType||{}).forEach(([t,v])=>{const b=by[t]=by[t]||{ok:0,n:0};b.ok+=v.ok;b.n+=v.n}));
  const rows=Object.entries(by).filter(([t])=>TYPES[t]).map(([t,v])=>({t,r:v.ok/v.n,n:v.n,ok:v.ok})).sort((a,b)=>a.r-b.r);
  if(rows.length){h+='<p class="sec">種類べつの正答率（にがてな順）</p><div class="bars">'+rows.map(r=>'<div class="bar"><span class="lbl">'+TYPES[r.t][0]+'</span><div class="trk"><div class="fil'+(r.r<.5?" low":r.r<.8?" mid":"")+'" style="width:'+Math.round(r.r*100)+'%"></div></div><span class="num">'+Math.round(r.r*100)+'%・'+r.ok+'/'+r.n+'</span></div>').join("")+'</div>'}
  h+='<p class="sec">さいきんの記録</p>'+(plays.length?'<ul class="plays">'+plays.slice(0,30).map(p=>'<li><details><summary><span>'+fmtDate(p.at)+'</span><span>'+(MODES[p.mode]||p.mode)+(p.stageName?"・"+p.stageName:"")+'</span><span>'+p.score+' / '+p.total+'</span>'+(p.rate!=null?'<span class="rt">'+rateHTML(p.rate)+'</span>':"")+'<span class="muted">'+fmtDur(p.durationSec)+'・まちがい '+(p.wrong||[]).length+'</span></summary>'+((p.wrong||[]).length?'<ul>'+p.wrong.map(w=>'<li>['+(TYPES[w.t]?TYPES[w.t][0]:w.t)+'] '+esc(w.text)+' → '+esc(w.ans)+'</li>').join("")+'</ul>':'<p class="muted" style="margin:6px 0 0">まちがいなし</p>')+'</details></li>').join("")+'</ul>':'<p class="muted">まだ記録がありません。</p>');
  if(!P.kid)h+='<div class="row" style="justify-content:flex-end">'+(P.confirmDel?'<span class="danger">「'+esc(pl.name)+'」を消しますか？（記録は残ります）</span><button class="btn sub sm" data-act="delno">やめる</button><button class="btn sm del" data-act="delyes">消す</button>':'<button class="btn sm del" data-act="delask">このプレイヤーを消す</button>')+'</div></section>';
  if(P.kid)h+='</section>';
  return h;
}
const fmtDate=t=>{const d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()+" "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")};
const fmtDur=s=>s>=60?Math.floor(s/60)+"分"+(s%60)+"秒":s+"秒";

/* ---- イベント ---- */
if(!window.__mjBound){window.__mjBound=true;
$("app").addEventListener("input",e=>{if(e.target.id==="nameIn"&&S.creating)S.creating.name=e.target.value});
$("app").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b||!b.dataset.act)return;const act=b.dataset.act,d=b.dataset;ensureAudio();
  if(act==="pick"){S.player=S.players.find(p=>p.id===d.id);S.screen="mode";snd("tap")}
  else if(act==="new"){S.creating={name:"",char:"puni"};S.screen="new"}
  else if(act==="char"){S.creating.char=d.id;snd("tap")}
  else if(act==="create"){const name=S.creating.name.trim();if(!name){$("nameIn").focus();return}const p={id:uid("p"),name,char:S.creating.char,coins:0,plays:0,prog:{},createdAt:Date.now()};S.players.push(p);S.player=p;await write(s=>s.savePlayer(p));S.screen="mode";snd("ok")}
  else if(act==="home"){if(S.game)clearTimeout(S.game.timer);S.game=null;S.edit=false;S.delId=null;S.screen="home"}
  else if(act==="mode"){S.game=null;S.screen="mode"}
  else if(act==="map"){if(S.game)clearTimeout(S.game.timer);S.game=null;if(d.mode)S.mode=d.mode;S.screen="map";snd("tap")}
  else if(act==="mute"){muted=!muted;try{localStorage.setItem("mj-mute",muted?"1":"0")}catch(x){}}
  else if(act==="stage"){const k=+d.k,pr=prog(S.player,S.mode);if(k>pr.cur)return;if(S.game)clearTimeout(S.game.timer);snd("tap");startGame(k);return}
  else if(act==="choose"){const g=S.game;if(!g)return;const q=g.qs[g.i],i=+d.i;if(!q||!q.perm||q.perm[i]==null)return;answer(q.perm[i]===0,i);return}
  else if(act==="key"){const g=S.game;if(!g||g.fb)return;if(d.k==="del")g.typed=g.typed.slice(0,-1);else if(g.typed.length<4)g.typed=(g.typed==="0"?"":g.typed)+d.k;
    const dp=$("disp"),go=$("goBtn");if(dp){dp.textContent=g.typed||"？";dp.classList.toggle("empty",!g.typed)}if(go)go.disabled=!g.typed;snd("tap");return}
  else if(act==="submit"){const g=S.game;if(!g||!g.typed)return;answer(+g.typed===g.qs[g.i].ans);return}
  else if(act==="next"){next();return}
  else if(act==="gate"){S.gate={a:rng(12,19),b:rng(6,9),typed:"",err:false,next:d.next||"parent"};S.screen="gate"}
  else if(act==="mine"){openMine();return}
  else if(act==="editoff"){S.edit=false;S.delId=null;S.screen="home"}
  else if(act==="hdel"){S.delId=d.id}
  else if(act==="hdelno"){S.delId=null}
  else if(act==="hdelyes"){const id=d.id;S.players=S.players.filter(p=>p.id!==id);S.delId=null;if(S.player&&S.player.id===id)S.player=null;await write(s=>s.deletePlayer(id));if(!S.players.length)S.edit=false}
  else if(act==="gkey"){const q=S.gate;if(d.k==="del")q.typed=q.typed.slice(0,-1);else if(q.typed.length<4)q.typed+=d.k;q.err=false}
  else if(act==="gsubmit"){const q=S.gate;if(+q.typed===q.a*q.b){if(q.next==="edit"){S.edit=true;S.delId=null;S.screen="home"}else{openParent();return}}else{q.typed="";q.err=true}}
  else if(act==="ptab"){S.parent.pid=d.id;S.parent.confirmDel=false;loadPlays();return}
  else if(act==="kuku"){S.settings.kukuMax=+d.n;write(s=>s.saveSettings(S.settings))}
  else if(act==="nq"){S.settings.nQ=+d.n;write(s=>s.saveSettings(S.settings))}
  else if(act==="delask"){S.parent.confirmDel=true}
  else if(act==="delno"){S.parent.confirmDel=false}
  else if(act==="delyes"){const id=S.parent.pid;S.players=S.players.filter(p=>p.id!==id);await write(s=>s.deletePlayer(id));S.parent.pid=S.players[0]?S.players[0].id:null;S.parent.confirmDel=false;loadPlays();return}
  render();
  if(act==="new"){const i=$("nameIn");if(i)i.focus()}
});}

/* ---- 起動 ---- */
let booted=false;
async function boot(data){
  if(booted)return;booted=true;
  if(data&&data.S&&data.S.screen){S=data.S}
  else{S.players=await Local.listPlayers();Object.assign(S.settings,await Local.getSettings())}
  render();
  try{const db=await (window.claude&&window.claude.use?window.claude.use("db"):null);
    if(db){const C=Cloud(db);const ps=await C.listPlayers();store=C;backend="cloud";S.players=ps;Object.assign(S.settings,await C.getSettings());
      if(S.player){const np=ps.find(p=>p.id===S.player.id);if(np)S.player=np}
      render()}
  }catch(e){}
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>

<script>
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{})})}
</script>
